apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: nyu-devops
servers: 1
agents: 2
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
registries:
  create:
    name: cluster-registry
    host: "0.0.0.0"
    hostPort: "5000"
  config: |
    mirrors:
      "cluster-registry:5000":
        endpoint:
          - http://cluster-registry:5000
