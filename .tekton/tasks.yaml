apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: lint
spec:
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install flake8
        flake8 .

    - name: pylint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install pipenv
        pipenv install --system --dev
        pylint service/
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "sqlite:///test.db"
        - name: RETRY_COUNT
          value: "1"
      script: |
        pip install pipenv
        pipenv install --system --dev
        pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: IMAGE_NAME
      type: string
      description: The image to deploy
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: bitnami/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/openshift/route.yaml
        kubectl set image deployment/products products=$(params.IMAGE_NAME)
        kubectl rollout status deployment/products
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: bdd
spec:
  workspaces:
    - name: source
  steps:
    - name: discover-route
      image: bitnami/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        HOST="$(kubectl get route products -o jsonpath='{.spec.host}')"
        test -n "${HOST}"
        printf 'https://%s' "${HOST}" > .base-url
    - name: bdd-tests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        export BASE_URL="$(cat .base-url)"
        apt-get update && apt-get install -y chromium chromium-driver
        pip install pipenv
        pipenv install --system --dev
        behave
