apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: lint
spec:
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install flake8
        flake8 .

    - name: pylint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install pipenv
        pipenv install --system --dev
        pylint service/
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "sqlite:///test.db"
        - name: RETRY_COUNT
          value: "1"
      script: |
        pip install pipenv
        pipenv install --system --dev
        pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings