apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: lint
spec:
  workspaces:
    - name: source
  steps:
    - name: flake8
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install flake8
        flake8 .

    - name: pylint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install pipenv
        pipenv install --system --dev
        pylint service/
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: tests
spec:
  workspaces:
    - name: source
  steps:
    - name: pytest
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "sqlite:///test.db"
        - name: RETRY_COUNT
          value: "1"
      script: |
        pip install pipenv
        pipenv install --system --dev
        pytest --pspec --cov=service --cov-fail-under=95 --disable-warnings
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build
spec:
  params:
    - name: IMAGE_NAME
      type: string
      description: The fully qualified image name
      default: image-registry.openshift-image-registry.svc:5000/$(context.pipelineRun.namespace)/products:latest
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable
      workingDir: $(workspaces.source.path)
      securityContext:
        privileged: true
      script: |
        buildah bud --format=oci -t $(params.IMAGE_NAME) .
        buildah push --tls-verify=false $(params.IMAGE_NAME)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: IMAGE_NAME
      type: string
      description: The image to deploy
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: bitnami/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        kubectl apply -R -f k8s/
        kubectl set image deployment/products products=$(params.IMAGE_NAME)
        kubectl rollout status deployment/products
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: bdd
spec:
  params:
    - name: BASE_URL
      type: string
      description: The route URL of the deployed products service
  workspaces:
    - name: source
  steps:
    - name: bdd-tests
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: BASE_URL
          value: $(params.BASE_URL)
      script: |
        apt-get update && apt-get install -y chromium chromium-driver
        pip install pipenv
        pipenv install --system --dev
        behave
